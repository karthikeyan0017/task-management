<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TaskFlow - Modern Full-Stack Task Management Application featuring real-time WebSockets, drag-and-drop Kanban, analytics, and responsive design.">
  <title>TaskFlow | Real-Time Task Management & Kanban Board</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  
  <!-- Modern Google Font: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Core CSS Design System -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/kanban.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div class="app-container">
    <!-- Mobile Sidebar Backdrop -->
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <!-- Sidebar Navigation -->
    <aside class="app-sidebar" id="app-sidebar">
      <div class="sidebar-header">
        <div class="brand-logo">
          <div class="brand-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          </div>
          <span>TaskFlow</span>
        </div>
      </div>

      <div class="sidebar-content">
        <!-- Views Section -->
        <div>
          <div class="nav-section-title">Views</div>
          <nav class="nav-menu">
            <a class="nav-item active" data-view-target="kanban" href="#kanban">
              <div class="nav-item-left">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="3" width="7" height="10" rx="1"/></svg>
                <span>Kanban Board</span>
              </div>
            </a>
            <a class="nav-item" data-view-target="list" href="#list">
              <div class="nav-item-left">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
                <span>List View</span>
              </div>
            </a>
            <a class="nav-item" data-view-target="analytics" href="#analytics">
              <div class="nav-item-left">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>
                <span>Analytics</span>
              </div>
            </a>
            <a class="nav-item" data-view-target="activity" href="#activity">
              <div class="nav-item-left">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                <span>Activity Feed</span>
              </div>
            </a>
          </nav>
        </div>

        <!-- Scope & Filters Section -->
        <div>
          <div class="nav-section-title">Filters</div>
          <nav class="nav-menu">
            <button class="nav-item active" data-scope-filter="all">
              <div class="nav-item-left">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/></svg>
                <span>All Tasks</span>
              </div>
            </button>
            <button class="nav-item" data-scope-filter="me">
              <div class="nav-item-left">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <span>Assigned to Me</span>
              </div>
            </button>
            <button class="nav-item" data-priority-filter="urgent">
              <div class="nav-item-left">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--danger);"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                <span>Urgent Priority</span>
              </div>
            </button>
          </nav>
        </div>

        <!-- Tags Cloud Section -->
        <div>
          <div class="nav-section-title">Tags</div>
          <div class="tags-list" id="sidebar-tags-container">
            <div class="tag-filter-chip active" data-tag="all">All</div>
          </div>
        </div>

        <!-- Workspace Progress Widget -->
        <div class="sidebar-stats-widget">
          <div class="widget-header">
            <span>Workspace Completion</span>
            <span id="sidebar-progress-text" style="font-weight: 700; color: var(--text-primary);">0%</span>
          </div>
          <div class="widget-progress-bar">
            <div class="widget-progress-fill" id="sidebar-progress-fill" style="width: 0%;"></div>
          </div>
        </div>
      </div>

      <!-- User Profile / Auth Footer -->
      <div class="sidebar-footer" id="sidebar-user-container">
        <!-- Populated dynamically by app.js -->
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="app-main">
      <!-- Header -->
      <header class="app-header">
        <div class="header-left">
          <button class="btn-icon mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle navigation">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>

          <!-- Search Input -->
          <div class="search-box-wrapper">
            <svg class="search-icon-abs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input class="search-input" id="global-search-input" type="text" placeholder="Search tasks, descriptions, or tags..." autocomplete="off" />
            <span class="search-shortcut-hint">/</span>
          </div>
        </div>

        <div class="header-right">
          <!-- WebSocket Live Badge -->
          <div class="ws-live-badge" id="ws-live-status" title="Real-time WebSocket synchronization status">
            <span class="ws-pulse-dot"></span>
            <span id="ws-live-text">Live Sync</span>
          </div>

          <!-- Theme Toggle -->
          <button class="btn-icon" id="theme-toggle-btn" aria-label="Toggle Theme" title="Toggle dark/light mode">
            <!-- SVG icon updated by app.js -->
          </button>

          <!-- New Task CTA Button -->
          <button class="btn btn-primary" id="header-new-task-btn" title="Create a new task (Hotkey: N)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
            <span class="btn-text-hide">New Task</span>
          </button>
        </div>
      </header>

      <!-- View Panels Container -->
      <div class="app-view-container">
        <!-- 1. Kanban Board View -->
        <div class="view-panel active" id="view-kanban">
          <!-- Populated by kanbanBoard.js -->
        </div>

        <!-- 2. List Table View -->
        <div class="view-panel" id="view-list">
          <!-- Populated by taskList.js -->
        </div>

        <!-- 3. Analytics View -->
        <div class="view-panel" id="view-analytics">
          <!-- Populated by analyticsView.js -->
        </div>

        <!-- 4. Activity Feed View -->
        <div class="view-panel" id="view-activity">
          <!-- Populated by activityFeed.js -->
        </div>
      </div>
    </main>

    <!-- Mobile Bottom Navigation -->
    <nav class="mobile-nav-bottom">
      <a class="mobile-nav-link active" data-view-target="kanban" href="#kanban">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="3" width="7" height="10" rx="1"/></svg>
        <span>Board</span>
      </a>
      <a class="mobile-nav-link" data-view-target="list" href="#list">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        <span>List</span>
      </a>
      <a class="mobile-nav-link" data-view-target="analytics" href="#analytics">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>
        <span>Stats</span>
      </a>
      <a class="mobile-nav-link" data-view-target="activity" href="#activity">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <span>Activity</span>
      </a>
    </nav>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Main ES Module Script -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
